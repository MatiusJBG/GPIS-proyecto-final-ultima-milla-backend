name: Backend Sprint 01

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_IMAGE: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:verify
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run lint
      - run: npm run build
      - name: SQL original e integración HTTP con PostgreSQL real
        run: npm run test:integration:postgres 2>&1 | tee integration-ci.txt
      - name: Conservar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-sprint-01-${{ github.sha }}
          path: integration-ci.txt
          if-no-files-found: ignore
