name: logistica_db_tests
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: logistica_test
      POSTGRES_USER: logistica_admin
      POSTGRES_PASSWORD: local_test_only
      APP_PASSWORD: app_test_only
      WORKER_PASSWORD: worker_test_only
      READONLY_PASSWORD: readonly_test_only
      TZ: UTC
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database:/workspace/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U logistica_admin -d logistica_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: logistica_test
      PGUSER: logistica_admin
      PGPASSWORD: local_test_only
    volumes:
      - ./database:/workspace/database:ro
    entrypoint: ["sh", "/workspace/database/tests/run.sh"]
